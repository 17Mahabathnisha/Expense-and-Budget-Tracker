<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Expense and Budget Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #080d2b, #172e72, #6845c5);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #c6d6ff;
            font-size: 13px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .welcome {
            text-align: center;
            color: #d0d9f5;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
            outline: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 14px;
        }

        input::placeholder {
            color: #c4cce5;
        }

        input:focus {
            border-color: #91baff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7774ff, #42b9ed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #d0d9f5;
        }

        .register-link a {
            color: #8edcff;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">EXPENSE AND BUDGET TRACKER</div>

        <p class="subtitle">SMART FINANCIAL MANAGEMENT</p>

        <h2>Welcome Back!</h2>

        <p class="welcome">
            Login to manage your expenses and budget.
        </p>

        <form method="POST">

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter your username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <button type="submit">Login →</button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</body>
</html>
