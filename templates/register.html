<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Expense and Budget Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #080d2b, #172e72, #6845c5);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #c6d6ff;
            font-size: 12px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .welcome {
            text-align: center;
            color: #d0d9f5;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
            outline: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 14px;
        }

        input::placeholder {
            color: #c4cce5;
        }

        input:focus {
            border-color: #91baff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7774ff, #42b9ed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #d0d9f5;
        }

        .login-link a {
            color: #8edcff;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">EXPENSE AND BUDGET TRACKER</div>

        <p class="subtitle">SMART FINANCIAL MANAGEMENT</p>

        <h2>Create Your Account</h2>

        <p class="welcome">
            Register to manage your expenses easily.
        </p>

        <form method="POST">

            <label>Full Name</label>
            <input type="text"
                   name="full_name"
                   placeholder="Enter your full name"
                   required>

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Create a username"
                   required>

            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>

            <button type="submit">Create Account →</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
